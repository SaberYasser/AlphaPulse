# early_trend_scanner configuration.
# Secrets (API keys, Telegram token/chat id) come from .env — never from this file.

symbols: [TSLA, NVDA, AAPL, QQQ, SPY, PLTR, AMD, AMZN, GOOGL, INTC, AVGO, MSTR, HOOD]

data:
  # "sip" = consolidated feed (requires Alpaca Algo Trader Plus / paid data plan).
  # "iex" = single-exchange feed, inadequate for consolidated volume; the program
  #         refuses to run with feed=iex unless demo_mode=true, and every Telegram
  #         message is then prefixed with "DEMO".
  # 2026-08-31: account probed — real-time SIP returns 409 (needs Algo Trader Plus).
  # Running labeled DEMO on IEX until upgraded; then set feed: sip, demo_mode: false.
  feed: iex
  demo_mode: true
  # Price LEVELS (prior-day / premarket highs & lows) come from consolidated
  # SIP history, which is included on every plan (only the last ~15 min is
  # restricted; the warmup tops that up from the live feed). Volume baselines
  # stay on the live feed so their units match the stream.
  history_feed: sip
  trading_base_url: https://paper-api.alpaca.markets   # clock/calendar only, works with any key
  data_base_url: https://data.alpaca.markets
  stream_base_url: wss://stream.data.alpaca.markets
  baseline_sessions: 5          # completed sessions used for minute-of-day baselines
  gap_reconnect_s: 10.0         # no stream message for this long during RTH -> reconnect
                                # (10s suits single-exchange IEX which has real lulls;
                                #  tighten back to ~5s on the consolidated SIP feed)
  recovery_min_gap_s: 2.0       # REST backfill of trades when a gap exceeds this
  stream_restart_max: 3         # full session-task rebuilds allowed after a stream death
  max_feed_latency_s: 3.0       # suppress new alerts when feed latency exceeds this
  queue_trades: 20000           # bounded asyncio queues (events, not bytes)
  queue_quotes: 10000
  # Regime context tape: [market proxy, volatility/fear proxy]. Their velocities
  # become model features; a proxy may also be scanned using the same trade stream.
  # SPY is intentionally both a scanned symbol and the market-regime proxy;
  # its trade stream is shared without duplicate subscriptions or aggregation.
  context_symbols: [SPY, VXX]

session:
  start_lead_min: 8             # process may start this many minutes before the open
  after_close: exit             # exit | pause  (pause = zero-work idle, no scanning)
  opening_range_min: 5          # opening-range window in minutes
  quiet_last_min: 60            # no NEW alerts in the last hour (no fresh positions there);
                                # signals still fire in shadow and keep training the model

engine:
  ring_seconds: 600             # 1-second aggregates kept per symbol (>= outcome window)
  minutes_kept: 420             # retain the full session for confirmation-to-close efficacy
  ready_bps: 8.0                # price within this of a level -> READY
  break_min_bps: 3.0            # must clear the level by at least this
  break_max_bps: 20.0           # reject alert if already extended beyond this past the level
  break_max_open_bps: 40.0      # opening-phase extension cap (gap-and-go movers run hotter)
  open_phase_min: 10.0          # minutes after the open using the opening-phase cap
  vel_min_bps_s: 2.0            # minimum 5-second directional velocity (bps/s)
  vel15_max_bps_s: 2.0          # corpus-mined late-chase kill (robust 5/6 sessions)
  range_exp_max: 3.0            # 15s range already fully expanded = late entry (4/6)
  accel_ratio: 1.10             # 5s velocity must exceed accel_ratio * 15s velocity
  vol_accel_min: 3.0            # 5s volume vs avg 5s over the prior 60s
  vol_base_min: 2.0             # 5s volume vs same-minute-of-day baseline
  baseline_skip_open_min: 2     # skip the baseline gate this many opening minutes: the
                                # baseline's first minute contains the auction print, so
                                # no live burst can look "2x normal" against it
  imb_min: 0.30                 # signed-volume imbalance in trigger direction (5s)
  imb15_min: 0.10               # regular micro-breaks need persistent 15s directional tape;
                                # deliberately not applied to sustained-trend signals
  persist_min_trades: 4         # directional trades required inside persist window
  persist_window_s: 2.5
  persist_min_span_s: 0.6       # first->last qualifying trade span (rejects one print)
  min_trades_2s: 3              # total prints in the last 2s (rejects isolated prints)
  single_print_max_frac: 0.70   # max share of directional volume one print may contribute
  # Fake-start penalty, mined from labeled sessions 2026-08-24..28: chase
  # evidence — a break from a still-expanding (uncompressed) range, or a 15s
  # tape already one-sided — weighs AGAINST the trigger score instead of hard
  # gating, so overwhelming volume/velocity can still fire. The penalty damps
  # to zero as 5s volume acceleration approaches fresh_break_vol_max: a fresh
  # volume explosion is never penalized. Rejections it causes are counted as
  # "fake_start".
  fresh_break_veto: true
  fresh_break_vol_max: 6.0      # penalty fully forgiven at/above this 5s volume accel
  comp_veto_ratio: 1.0          # staleness starts above this last-3m/prior-10m range ratio
  imb15_blowoff_max: 0.55       # staleness starts above this aligned 15s imbalance
  fake_start_weight: 0.30       # max score penalty when fully stale and volume-quiet
  score_min: 0.70               # weighted trigger score threshold (rule baseline)
  sweep_window_s: 90.0          # sweep-and-reclaim lookback
  sweep_max_bps: 20.0           # max excursion beyond a level for it to count as a sweep
  compression_max_ratio: 0.75   # last-3m/prior-10m range ratio treated as compression
  compression_relax: 0.90       # score threshold multiplier while compressed (>= bound)
  invalidation_min_bps: 6.0
  open_range_floor_bps: 100.0   # opening-phase invalidations size against at least this
                                # much range: opening tape whips 20-30 bps in seconds and
                                # a normal-hours stop distance is pure noise there
  invalidation_range_frac: 0.35 # fraction of the recent 5m range used for invalidation
  invalidation_max_bps: 40.0
  confirm_min_s: 60.0           # verdict ~1 minute after the alert (owner directive)
  confirm_min_r: 0.5            # CONFIRMED needs this much progress beyond the trigger,
                                # measured in invalidation-distance units (raise = pickier)
  observe_max_s: 80.0           # follow-up decision deadline after EARLY
  fail_buffer_bps: 2.0          # trigger recross needed for FAILED
  cooldown_failed_s: 300.0
  cooldown_confirmed_s: 600.0
  cooldown_suppressed_s: 180.0  # model-silenced setups re-arm sooner (nothing was sent)
  re_arm_bps: 20.0              # a new setup must use a level at least this far from the last one
  max_alerts_symbol_day: 5
  max_alerts_hour_total: 10
  max_alerts_burst: 3           # max alerts in any rolling minute across the universe:
                                # the bell re-prices everything at once; three messages
                                # in a minute is signal, ten in six seconds is noise
  # Sustained-pressure ("trend onset") detector: the band between micro-burst
  # and grind — a 60-90s escalator on dominant one-sided volume making new
  # local extremes (built after the MSTR 12:10 case, 2026-08-31). Rule-pure
  # until the model has learned the class.
  trend_detector: true
  trend_window_s: 75            # net-move lookback
  trend_min_bps: 25.0           # net directional move over the window
  trend_dir_share_min: 0.60     # one-sided share of classified 60s volume
  trend_vol_base_min: 1.8       # 60s volume vs minute-of-day baseline
  trend_extreme_min: 15         # must print a new N-minute high/low
  trend_max_per_day: 2          # per symbol
  trend_model_gated: false      # let the ARF learn the class before it may gate it
  min_gap_same_symbol_s: 120.0

ml:
  engine: auto                  # auto | river | builtin  (auto -> river Adaptive Random
                                # Forest if importable, else builtin online logistic)
  min_labels: 40                # labels required before ML influences live thresholds
  prob_gate_min: 0.60           # signals below this model probability are suppressed (once active);
                                # chosen on the 2026-08-28 v3 holdout: 71% cut incl. veto+bypass
  prob_bypass_score: 0.80       # raw trigger score at/above this always delivers: market
                                # context (SPY/VIX) informs the model but must never veto
                                # exceptional price+volume evidence
  efficacy_min_labels: 40       # exact confirmation-to-close outcomes before this model gates
  efficacy_prob_gate_min: 0.60  # then require >=60% estimated session-direction persistence
  outcome_window_s: 300         # 1..5 minute outcome; label decided at this horizon
  pos_multiple: 1.5             # MFE must reach 1.5x invalidation distance before invalidation
  min_remaining_frac: 0.50      # portion of trigger->peak move still ahead at alert time
  bound_low: 0.75               # adaptive threshold multipliers clamped to [bound_low, bound_high]
  bound_high: 1.50
  adapt_step: 0.02
  revert_window: 30             # labeled signals in the rolling precision window
  revert_precision_drop: 0.15   # revert ML gating when precision drops this far below baseline
  checkpoint_min: 15            # model/gate checkpoint interval (minutes)

telegram:
  expected_username: YassirSaber
  prefix: ""                    # live project — no DEMO branding (owner's call, 2026-08-31)
  max_retries: 4
  send_timeout_s: 5.0
  dedupe_size: 512

storage:
  instance_lock_port: 47113     # single-instance guard (0 disables)
  db_path: data/scanner.db
  retention_days: 90
  status_path: data/status.json
  model_dir: data/models
  log_dir: logs
  log_level: INFO
